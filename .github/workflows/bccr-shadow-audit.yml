name: BCCR shadow audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: write

concurrency:
  group: bccr-shadow-audit-stable-public
  cancel-in-progress: false

jobs:
  shadow-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stable-public
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Rehearse database recovery without changing the source
        env:
          PYTHONPATH: .
        run: python scripts/rehearse_sqlite_recovery.py franquestions.db
      - name: Run read-only BCCR shadow check
        env:
          FQ_BCCR_TOKEN: ${{ secrets.FQ_BCCR_TOKEN }}
          PYTHONPATH: .
        run: python scripts/run_bccr_shadow_audit.py
      - name: Commit append-only audit record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_reports/bccr_exchange_rate_shadow.jsonl
          git diff --cached --quiet || git commit -m "Record BCCR shadow audit run"
          git push origin HEAD:stable-public
      - name: Check public Streamlit availability
        if: always()
        env:
          HEALTH_URL: https://franquestions-observatorio-v2.streamlit.app/~/+/_stcore/health
        run: |
          for attempt in {1..6}; do
            response="$(curl --fail --silent --show-error --location --max-time 30 "$HEALTH_URL" || true)"
            response="${response//$'\r'/}"
            if [[ "$response" == "ok" ]]; then
              echo "Public Streamlit health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt of 6 did not return ok."
            [[ "$attempt" -lt 6 ]] && sleep 10
          done
          echo "::error::Public Streamlit health check did not return ok."
          exit 1
